services:
  - type: web
    name: whatsapp-backend
    env: python
    region: singapore
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt && alembic upgrade head"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_NAME
        value: "WhatsApp CRM — JWL"
      - key: ENVIRONMENT
        value: "production"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-redis
          property: connectionString

  - type: worker
    name: whatsapp-worker
    env: python
    region: singapore
    plan: standard
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python worker.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: APP_NAME
        value: "WhatsApp CRM Worker — JWL"
      - key: ENVIRONMENT
        value: "production"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: whatsapp-redis
          property: connectionString

databases:
  - name: whatsapp-db
    region: singapore
    plan: standard
    databaseName: whatsapp_crm
    user: crm_admin

redis:
  - name: whatsapp-redis
    region: singapore
    plan: standard
    maxmemoryPolicy: noeviction

