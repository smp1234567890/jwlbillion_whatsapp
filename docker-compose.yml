version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: crm_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      POSTGRES_DB: whatsapp_crm
    volumes:
      - crm_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - SCHEDULER_ENABLED=false
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_worker
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/.env
    environment:
      - SCHEDULER_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
    command: ["python", "worker.py"]

volumes:
  crm_db_data:
